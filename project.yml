name: SpeechTextApp
options:
  bundleIdPrefix: com.rianiskandar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    version: "1.1.9"

targets:
  SpeechTextApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: WhisperKit
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rianiskandar.SpeechTextApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SpeechTextApp needs microphone access to record audio for transcription."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "15.0"

  SpeechTextAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SpeechTextApp
    settings:
      base:
        SWIFT_VERSION: "5"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  SpeechTextApp:
    build:
      targets:
        SpeechTextApp: all
        SpeechTextAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpeechTextAppTests
